<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Render preview</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; background: #0b1020; color: #cfe3ee; font: 12px/1.35 "Segoe UI", Arial, sans-serif; }
  #bar { display: flex; flex-wrap: wrap; gap: 6px 14px; padding: 6px 10px; background: #101c2c; border-bottom: 1px solid #28405a; align-items: center; }
  #bar label { display: inline-flex; gap: 4px; align-items: center; white-space: nowrap; }
  #bar select, #bar input[type=range], #bar button { font: inherit; }
  #bar button { background: #1d3550; color: #cfe3ee; border: 1px solid #38597d; padding: 2px 8px; cursor: pointer; }
  #stage { display: flex; justify-content: center; padding: 8px; }
  #frame { position: relative; background: #000; outline: 1px solid #38597d; }
  canvas { display: block; image-rendering: pixelated; }
  #hud { position: absolute; left: 6px; top: 6px; color: #fff; font: 11px monospace; text-shadow: 0 1px 2px #000; pointer-events: none; white-space: pre; }
  #buildings { display: flex; flex-wrap: wrap; gap: 2px 8px; max-width: 100%; }
  #status { color: #8fb3c9; }
</style>
</head>
<body>
<div id="bar">
  <label>Режим <select id="mode"><option value="hub">хаб</option><option value="flight">полёт</option><option value="backdrop">фон</option></select></label>
  <label>Кадр <select id="frameSel">
    <option value="fit">по размеру окна</option>
    <option value="960x540@2">ландшафт 960x540 @2</option>
    <option value="640x360@3">мини 640x360 @3</option>
    <option value="480x270@2">мини 480x270 @2</option>
    <option value="270x480@2">мини портрет 270x480 @2</option>
    <option value="844x390@2">телефон гориз. 844x390 @2</option>
    <option value="360x640@2">портрет 360x640 @2</option>
    <option value="390x844@1">портрет 390x844 @1</option>
    <option value="1280x720@1">ПК 1280x720 @1</option>
  </select></label>
  <label>Эпоха <select id="era"><option>0</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select></label>
  <label>Погода <select id="weather"><option>clear</option><option>cloudy</option><option>rain</option><option>storm</option></select></label>
  <label><input type="checkbox" id="reduce"> reduceMotion</label>
  <span id="hubControls">
    <label>Выбор <select id="selected"><option value="">—</option></select></label>
    <button id="allB">все постройки</button><button id="noB">ничего</button>
    <label>Уровень <select id="level"><option value="auto">по эпохе</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option></select></label>
    <label><input type="checkbox" id="booster"> блок</label>
    <label><input type="checkbox" id="capsuleP"> капсула</label>
    <div id="buildings"></div>
  </span>
  <span id="flightControls" hidden>
    <label>Тело <select id="body"><option>earth</option><option>moon</option><option>mars</option></select></label>
    <label>Сценарий <select id="scenario">
      <option value="pad">на столе</option><option value="launch">старт</option><option value="ascent">подъём</option>
      <option value="space">космос</option><option value="descent">спуск</option><option value="chute">парашют</option><option value="landing">посадка</option>
      <option value="loop">полный цикл</option><option value="sim">настоящая sim</option><option value="free">ручной</option></select></label>
    <label>Высота <input id="alt" type="range" min="0" max="12000" value="0" step="10"><span id="altv">0</span></label>
    <label>Тяга <input id="thr" type="range" min="0" max="1" value="0" step="0.05"></label>
    <label>Угол <input id="ang" type="range" min="-1.2" max="1.2" value="0" step="0.05"></label>
    <label><input type="checkbox" id="objs" checked> объекты</label>
    <label>Скорость sim <select id="simSpeed"><option>1</option><option>2</option><option>4</option><option>8</option></select></label>
    <label>Ступень <select id="stage"><option value="booster">booster</option><option value="core">core</option><option value="capsule">capsule</option></select></label>
    <button id="evBtn">событие: удар</button><button id="sepBtn">событие: ступень</button>
  </span>
  <span id="backdropControls" hidden>
    <label>Фон <select id="bkind"><option>workshop</option><option>shop</option><option>launch-earth</option><option>launch-moon</option></select></label>
    <label>Затемнение <input id="bdim" type="range" min="0" max="0.9" step="0.05" value="0.2"></label>
    <label><input type="checkbox" id="bstations" checked> станции</label>
  </span>
  <span id="status"></span>
</div>
<div id="stage"><div id="frame"><canvas id="canvas"></canvas><div id="hud"></div></div></div>
<script type="module" src="./preview.js"></script>
</body>
</html>
