name: Promote approved 2D asset

on:
  workflow_dispatch:
    inputs:
      asset:
        description: Visually approved asset family
        required: true
        type: choice
        options: [W04, B03]

permissions:
  contents: write
  pull-requests: write

jobs:
  promote:
    runs-on: ubuntu-24.04
    env:
      ASEPRITE_VERSION: '1.3.18.6'
      PIXEL_SNAPPER_REV: 'ae20461f60fb39e75d15f184bab1ebec1219511c'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - name: Install art build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            clang cmake ninja-build unzip curl python3-pil jq \
            libpixman-1-dev libfreetype6-dev libharfbuzz-dev zlib1g-dev \
            libx11-dev libxcursor-dev libxi-dev libxrandr-dev libgl1-mesa-dev \
            libfontconfig1-dev libjpeg-dev libpng-dev libwebp-dev
      - name: Restore canonical art tool cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/art-tool-cache
          key: art-tools-${{ runner.os }}-${{ runner.arch }}-aseprite-1.3.18.6-none-snapper-ae20461f
      - name: Set up canonical art tools
        run: tools/art_pipeline/setup_art_tools.sh "$RUNNER_TEMP/art-tools" "$RUNNER_TEMP/art-tool-cache"
      - name: Rebuild exact candidate
        run: |
          python3 tools/art_pipeline/process_asset.py \
            --repo-root . \
            --asset '${{ inputs.asset }}' \
            --output "$RUNNER_TEMP/candidate" \
            --pixel-snapper "$RUNNER_TEMP/art-tools/spritefusion-pixel-snapper" \
            --aseprite "$RUNNER_TEMP/art-tools/aseprite"
      - name: Enforce hash-bound visual approval and stage production
        run: |
          python3 tools/art_pipeline/promote_asset.py \
            --repo-root . \
            --asset '${{ inputs.asset }}' \
            --candidate "$RUNNER_TEMP/candidate"
      - name: Create promotion PR instead of pushing main
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet && git diff --cached --quiet; then
            echo 'No production changes to promote.'
            exit 0
          fi
          asset='${{ inputs.asset }}'
          branch="2d_promote-${asset,,}-${GITHUB_RUN_ID}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$branch"
          git add -A art/gen outputs/rocket/runtime-assets.json outputs/rocket/dist/assets
          git commit -m "Promote ${asset} approved art [skip asset-candidate]"
          git push origin "$branch"
          if ! gh pr create \
            --base main \
            --head "$branch" \
            --title "2D: promote ${asset} approved asset" \
            --body "Deterministic promotion from canonical sources. Automatic QA passed and visual approval was verified against exact PNG SHA-256 values. Runtime now reads this family from art/gen; the legacy committed runtime mirror is removed."; then
            echo "::warning::Promotion branch $branch was pushed, but GitHub Actions is not allowed to create pull requests in this repository. Open a PR from that branch manually; main was not modified."
          fi
