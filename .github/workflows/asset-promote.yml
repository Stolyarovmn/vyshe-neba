name: Promote approved 2D asset to production

on:
  push:
    branches:
      - 'asset-promote/**'
    paths:
      - '.asset-command/promote.json'

permissions:
  contents: write
  pull-requests: write
  actions: read
  issues: write

jobs:
  promote-production:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: asset-pipeline-command-${{ github.ref_name }}
      cancel-in-progress: false
    env:
      ASEPRITE_VERSION: '1.3.18.6'
      PIXEL_SNAPPER_REV: 'ae20461f60fb39e75d15f184bab1ebec1219511c'
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout production command branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify command branch and resolve asset
        id: command
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin game-production
          base="$(git rev-parse origin/game-production)"
          command='.asset-command/promote.json'
          test -f "$command"
          asset="$(jq -er '.asset | strings | select(length > 0)' "$command")"
          requested_base="$(jq -er '.production_base_sha | strings | select(length == 40)' "$command")"
          if [ "$requested_base" != "$base" ]; then
            echo "Stale/incorrect production base: command=$requested_base current=$base" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$base" HEAD; then
            echo 'Command branch is not based on the current game-production commit.' >&2
            exit 1
          fi
          mapfile -t changed < <(git diff --name-only "$base...HEAD" | sort -u)
          if [ "${#changed[@]}" -ne 1 ] || [ "${changed[0]}" != "$command" ]; then
            echo 'Promotion command branch may change only .asset-command/promote.json.' >&2
            printf '%s\n' "${changed[@]}" >&2
            exit 1
          fi
          python3 - "$asset" <<'PY'
          import json, sys
          from pathlib import Path
          asset=sys.argv[1]
          cfg=json.loads(Path('art/placeables/PIPELINE_CONFIG.json').read_text(encoding='utf-8'))
          if asset not in cfg.get('assets', {}):
              raise SystemExit(f'unknown asset id: {asset}')
          PY
          checkpoint="asset-checkpoint-${asset}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "asset=$asset" >> "$GITHUB_OUTPUT"
          echo "checkpoint=$checkpoint" >> "$GITHUB_OUTPUT"
          echo "production_base_sha=$base" >> "$GITHUB_OUTPUT"
          echo "ASSET=$asset" >> "$GITHUB_ENV"
          echo "CHECKPOINT_NAME=$checkpoint" >> "$GITHUB_ENV"
          echo "PRODUCTION_BASE_SHA=$base" >> "$GITHUB_ENV"
          # Remove the command-only commit from the working tree before staging production art.
          git reset --hard "$base"

      - name: Restore latest candidate checkpoint
        run: |
          python3 tools/art_pipeline/restore_asset_checkpoint.py \
            --asset "$ASSET" \
            --dest "$RUNNER_TEMP/candidate"

      - name: Install art build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            clang cmake ninja-build unzip curl python3-pil jq \
            libpixman-1-dev libfreetype6-dev libharfbuzz-dev zlib1g-dev \
            libx11-dev libxcursor-dev libxi-dev libxrandr-dev libgl1-mesa-dev \
            libfontconfig1-dev libjpeg-dev libpng-dev libwebp-dev

      - name: Restore canonical art tool cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/art-tool-cache
          key: art-tools-${{ runner.os }}-${{ runner.arch }}-aseprite-1.3.18.6-none-snapper-ae20461f

      - name: Set up canonical art tools
        run: bash tools/art_pipeline/setup_art_tools.sh "$RUNNER_TEMP/art-tools" "$RUNNER_TEMP/art-tool-cache"

      - name: Resume and verify exact deterministic candidate
        run: |
          python3 tools/art_pipeline/process_asset.py \
            --repo-root . \
            --asset "$ASSET" \
            --output "$RUNNER_TEMP/candidate" \
            --state-dir "$RUNNER_TEMP/candidate/.tracker" \
            --pixel-snapper "$RUNNER_TEMP/art-tools/spritefusion-pixel-snapper" \
            --aseprite "$RUNNER_TEMP/art-tools/aseprite" \
            --resume

      - name: Enforce hash-bound visual approval and stage production only
        run: |
          python3 tools/art_pipeline/promote_asset.py \
            --repo-root . \
            --asset "$ASSET" \
            --candidate "$RUNNER_TEMP/candidate" \
            --state-dir "$RUNNER_TEMP/candidate/.tracker"

      - name: Reject runtime/build files in production promotion diff
        shell: bash
        run: |
          set -euo pipefail
          bad="$(git diff --name-only | grep -Ev '^art/gen/' || true)"
          if [ -n "$bad" ]; then
            echo 'Production promotion attempted to change non-production paths:' >&2
            printf '%s\n' "$bad" >&2
            exit 1
          fi

      - name: Create production promotion PR
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet && git diff --cached --quiet; then
            echo 'No production changes to promote.'
            exit 0
          fi
          branch="art_promote-${ASSET,,}-${GITHUB_RUN_ID}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$branch"
          git add -A art/gen
          mapfile -t staged < <(git diff --cached --name-only)
          if [ "${#staged[@]}" -eq 0 ] || printf '%s\n' "${staged[@]}" | grep -Ev '^art/gen/'; then
            echo 'Production PR staging escaped art/gen or is empty.' >&2
            exit 1
          fi
          git commit -m "Promote ${ASSET} approved art to production"
          git push origin "$branch"
          if ! gh pr create \
            --base game-production \
            --head "$branch" \
            --title "Art: promote ${ASSET} approved production asset" \
            --body "Boundary A only: exact-SHA approved candidate -> game-production at base ${PRODUCTION_BASE_SHA}. This PR intentionally contains production art/provenance only and does not publish runtime files. Runtime publication is a separate PR into main using art/runtime/RUNTIME_EXPORTS.json."; then
            echo "::warning::Promotion branch $branch was pushed, but Actions could not create the production PR. game-production/main were not modified directly."
          fi

      - name: Render tracker summary
        if: always()
        run: |
          if [ -n "${ASSET:-}" ] && [ -d "$RUNNER_TEMP/candidate/.tracker/$ASSET" ]; then
            python3 tools/art_pipeline/sync_asset_tracker_issue.py \
              --repo-root . --asset "$ASSET" \
              --state-dir "$RUNNER_TEMP/candidate/.tracker" \
              --artifact-name "$CHECKPOINT_NAME" \
              --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              --dry-run >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload updated promotion checkpoint
        if: always() && steps.command.outputs.asset != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.command.outputs.checkpoint }}
          path: ${{ runner.temp }}/candidate/
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: warn

      - name: Sync durable asset tracker issue
        if: always()
        run: |
          if [ -n "${ASSET:-}" ] && [ -d "$RUNNER_TEMP/candidate/.tracker/$ASSET" ]; then
            python3 tools/art_pipeline/sync_asset_tracker_issue.py \
              --repo-root . --asset "$ASSET" \
              --state-dir "$RUNNER_TEMP/candidate/.tracker" \
              --artifact-name "$CHECKPOINT_NAME" \
              --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
