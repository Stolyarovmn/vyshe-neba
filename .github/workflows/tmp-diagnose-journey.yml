name: Temporary journey regression diagnostic
on:
  push:
    branches:
      - 2d_world-background-traffic-fix
permissions:
  contents: read
jobs:
  diagnose:
    if: github.event.head_commit.message == 'Diagnose journey regression'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2d_world-background-traffic-fix
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install browser QA harness
        run: |
          npm install --no-save --ignore-scripts playwright@1.62.1
          if command -v google-chrome >/dev/null 2>&1; then
            echo "CHROMIUM_EXECUTABLE_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
          elif command -v chromium >/dev/null 2>&1; then
            echo "CHROMIUM_EXECUTABLE_PATH=$(command -v chromium)" >> "$GITHUB_ENV"
          else
            exit 1
          fi
          echo 'CHROMIUM_ARGS=["--no-sandbox","--disable-dev-shm-usage"]' >> "$GITHUB_ENV"
      - name: Instrument journey assertion in workspace only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('outputs/rocket/qa-journey.cjs')
          s=p.read_text()
          old="assert(run.max<=89&&run.bounds);"
          new="console.log('JOURNEY_ASCENT_DIAGNOSTIC '+JSON.stringify(run));assert(run.max<=89&&run.bounds,'50s ascent camera/speed contract: '+JSON.stringify(run));"
          if s.count(old)!=1:
              raise SystemExit(f'expected one journey assertion, got {s.count(old)}')
          p.write_text(s.replace(old,new))
          PY
      - name: Build standalone
        run: node outputs/rocket/build.cjs
      - name: Run journey QA diagnostic
        run: node outputs/rocket/qa-journey.cjs
