name: Repository final audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repo-final-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run repository regression suite
        run: npm test
      - name: Audit exact PNG duplicates in production sprite roots
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          from collections import defaultdict
          from pathlib import Path

          roots = [Path('art/gen'), Path('outputs/rocket/dist/assets')]
          groups = defaultdict(list)
          for root in roots:
              if not root.exists():
                  continue
              for p in root.rglob('*.png'):
                  groups[hashlib.sha256(p.read_bytes()).hexdigest()].append(p.as_posix())

          def key(path):
              for prefix in ('art/gen/', 'outputs/rocket/dist/assets/'):
                  if path.startswith(prefix):
                      return path[len(prefix):]
              return path

          duplicates = [paths for paths in groups.values() if len(paths) > 1]
          expected_mirrors = []
          other = []
          for paths in duplicates:
              keys = {key(p) for p in paths}
              roots_seen = {p.split('/', 1)[0] for p in paths}
              if len(keys) == 1 and roots_seen == {'art', 'outputs'} and len(paths) == 2:
                  expected_mirrors.append(paths)
              else:
                  other.append(paths)

          print(f'PNG_FILES={sum(len(v) for v in groups.values())}')
          print(f'DUPLICATE_HASH_GROUPS={len(duplicates)}')
          print(f'EXPECTED_ART_GEN_RUNTIME_MIRRORS={len(expected_mirrors)}')
          print(f'OTHER_DUPLICATE_GROUPS={len(other)}')
          for i, paths in enumerate(other, 1):
              print(f'OTHER_DUPLICATE_{i}:')
              for p in paths:
                  print(f'  {p}')
          PY
