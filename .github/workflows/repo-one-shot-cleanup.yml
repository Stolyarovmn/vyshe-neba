name: Repository one-shot cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repo-one-shot-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove obsolete W04 transport copies
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f art/source_archives/w04_flight_simulator/*.b64
          git add -A art/source_archives/w04_flight_simulator
          if ! git diff --cached --quiet; then
            git commit -m 'repo: remove obsolete W04 base64 transport copies [skip ci]'
            git push origin HEAD:main
          fi

      - name: Delete merged and technical branches
        shell: bash
        run: |
          set -euo pipefail
          for branch in \
            2d_workshop-placeables-w01 \
            infra-wave2-upload \
            noop \
            noop2 \
            tmp-do-not-use \
            tmp-test-noop \
            tmp-test-noop2
          do
            if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
              git push origin --delete "$branch"
            fi
          done
