name: Temporary world fix patcher
on:
  push:
    branches:
      - 2d_world-background-traffic-fix
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message == 'Run world fix patcher'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2d_world-background-traffic-fix
      - name: Apply source patch
        run: python3 tools/apply_world_background_traffic_fix.py
      - name: Commit generated source fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add outputs/rocket/dist/world-art.js outputs/rocket/dist/game.js outputs/rocket/dist/assets/aircraft/traffic.json live/aircraft.js
          git diff --cached --check
          git commit -m '2D: fix world background and traffic streaming [world-fix-generated]'
          git push origin HEAD:2d_world-background-traffic-fix
