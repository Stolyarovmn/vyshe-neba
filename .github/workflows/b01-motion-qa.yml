name: B01 motion sheet QA

on:
  push:
    branches: [main]
    paths:
      - 'outputs/rocket/dist/weather-complex-rig.js'
      - 'outputs/rocket/dist/assets/placeables/base/weather_complex/**'
      - 'outputs/rocket/qa-b01-rig.cjs'
      - 'tools/art_pipeline/b01_motion_sheet.py'
      - '.github/workflows/b01-motion-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  motion-sheet:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Diagnose B01 atlas PNG structure
        run: |
          set -euxo pipefail
          P=outputs/rocket/dist/assets/placeables/base/weather_complex/parts/body_eras.png
          file "$P"
          wc -c "$P"
          xxd -l 40 "$P"
          git check-attr -a -- "$P" || true
          SHA=$(git rev-parse HEAD:"$P")
          echo "blob=$SHA"
          git cat-file -s "$SHA"
          python3 - "$P" <<'PY'
          import struct,sys,zlib
          p=sys.argv[1]
          b=open(p,'rb').read()
          assert b[:8]==b'\x89PNG\r\n\x1a\n'
          for sig in (b'IHDR',b'PLTE',b'tRNS',b'IDAT',b'IEND'):
              hits=[]; start=0
              while True:
                  i=b.find(sig,start)
                  if i<0: break
                  hits.append(i); start=i+1
              print(sig.decode(), 'offsets', hits)
          pos=8
          while pos+12<=len(b):
              n=struct.unpack('>I',b[pos:pos+4])[0]
              typ=b[pos+4:pos+8]
              if pos+12+n>len(b):
                  print('BROKEN_CHUNK', 'offset',pos,'type',typ,'declared_len',n,'remaining',len(b)-pos)
                  break
              dat=b[pos+8:pos+8+n]
              got=struct.unpack('>I',b[pos+8+n:pos+12+n])[0]
              want=zlib.crc32(typ+dat)&0xffffffff
              print('CHUNK','offset',pos,'type',typ.decode('ascii','replace'),'len',n,'crc',('OK' if got==want else f'BAD got={got:08x} want={want:08x}'))
              pos+=12+n
              if typ==b'IEND': break
          for off in range(780,900,32):
              print(f'HEX@{off}',b[off:off+32].hex())
          print('parsed_bytes',pos,'file_bytes',len(b))
          PY

      - name: Install Pillow
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y python3-pil

      - name: Run B01 causal rig regression QA
        run: node outputs/rocket/qa-b01-rig.cjs

      - name: Render B01 E0-E5 motion sheets
        run: |
          set -euxo pipefail
          OUT="$RUNNER_TEMP/b01-motion-qa"
          python3 tools/art_pipeline/b01_motion_sheet.py \
            --root outputs/rocket/dist/assets/placeables/base/weather_complex/parts \
            --output-dir "$OUT"
          test -s "$OUT/b01_motion_sheet.png"
          test -s "$OUT/motion_qa.json"

      - name: Upload B01 motion QA artifact
        uses: actions/upload-artifact@v4
        with:
          name: b01-motion-qa
          path: ${{ runner.temp }}/b01-motion-qa/
          retention-days: 3
