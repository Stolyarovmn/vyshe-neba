name: Repository branch prune

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repo-branch-prune.yml'

permissions:
  contents: write

jobs:
  prune:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Delete every remote branch except main
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t branches < <(git ls-remote --heads origin | awk '{sub("refs/heads/", "", $2); print $2}')
          for branch in "${branches[@]}"; do
            if [[ "$branch" != "main" ]]; then
              git push origin --delete "$branch"
            fi
          done
