name: Art tools bootstrap

on:
  push:
    branches: [main]
    paths:
      - 'tools/art_pipeline/setup_art_tools.sh'
      - '.github/workflows/art-tools-bootstrap.yml'
  pull_request:
    paths:
      - 'tools/art_pipeline/setup_art_tools.sh'
      - '.github/workflows/art-tools-bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-tools:
    runs-on: ubuntu-24.04
    env:
      ASEPRITE_VERSION: '1.3.18.6'
      PIXEL_SNAPPER_REV: 'ae20461f60fb39e75d15f184bab1ebec1219511c'
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            clang cmake ninja-build unzip curl \
            libpixman-1-dev libfreetype6-dev libharfbuzz-dev zlib1g-dev \
            libx11-dev libxcursor-dev libxi-dev libxrandr-dev libgl1-mesa-dev \
            libfontconfig1-dev libjpeg-dev libpng-dev libwebp-dev
      - name: Restore canonical art tool cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/art-tool-cache
          key: art-tools-${{ runner.os }}-${{ runner.arch }}-aseprite-1.3.18.6-none-snapper-ae20461f
      - name: Build canonical tool bundle
        run: bash tools/art_pipeline/setup_art_tools.sh "$RUNNER_TEMP/art-tools" "$RUNNER_TEMP/art-tool-cache"
      - uses: actions/upload-artifact@v4
        with:
          name: canonical-art-tools-linux-x64
          path: ${{ runner.temp }}/art-tools/
          retention-days: 1
