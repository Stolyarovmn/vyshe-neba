name: Temporary journey QA stabilization patcher
on:
  push:
    branches:
      - 2d_world-background-traffic-fix
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message == 'Run journey QA stabilization patcher'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2d_world-background-traffic-fix
      - run: python3 tools/tmp_stabilize_journey_qa.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add outputs/rocket/qa-journey.cjs
          git diff --cached --check
          git commit -m 'QA: stabilize journey weather seed [journey-qa-generated]'
          git push origin HEAD:2d_world-background-traffic-fix
