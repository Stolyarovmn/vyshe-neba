name: Art transport materializer

on:
  push:
    branches: [2d_workshop-placeables-w01]
    paths:
      - 'art/raw/placeables/workshop/flight_simulator/*_presnap.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize-w04-transport:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decode staged W04 transport PNGs
        shell: bash
        run: |
          set -euo pipefail
          RAW_DIR='art/raw/placeables/workshop/flight_simulator'
          STAGE_DIR='art/transport_staging/w04'
          changed=0
          mkdir -p "$STAGE_DIR"

          for stem in e0_1978 e1_1986 e2_1998 e3_2015 e4_2035 e5_2060; do
            b64="$STAGE_DIR/${stem}_presnap.b64"
            sum="$STAGE_DIR/${stem}_presnap.sha256"
            out="$RAW_DIR/${stem}_presnap.png"
            if [[ ! -f "$b64" ]]; then
              continue
            fi
            if [[ ! -f "$sum" ]]; then
              echo "missing checksum for staged transport: $sum" >&2
              exit 1
            fi
            expected=$(tr -d '[:space:]' < "$sum")
            tmp="${out}.tmp"
            base64 --decode "$b64" > "$tmp"
            actual=$(sha256sum "$tmp" | awk '{print $1}')
            if [[ "$actual" != "$expected" ]]; then
              echo "checksum mismatch for $stem: expected=$expected actual=$actual" >&2
              rm -f "$tmp"
              exit 1
            fi
            mv "$tmp" "$out"
            rm -f "$b64" "$sum"
            echo "materialized $out sha256=$actual"
            changed=1
          done

          echo "changed=$changed" >> "$GITHUB_ENV"

      - name: Commit materialized transport
        if: env.changed == '1'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A art/raw/placeables/workshop/flight_simulator art/transport_staging/w04
          if git diff --cached --quiet; then
            echo 'No transport changes.'
            exit 0
          fi
          git commit -m 'Materialize staged W04 transport PNG [skip transport-materialize]'
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
