name: Pixel Snapper bootstrap

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pixel-snapper-bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-pixel-snapper:
    runs-on: ubuntu-24.04
    env:
      PIXEL_SNAPPER_REV: 'ae20461f60fb39e75d15f184bab1ebec1219511c'
    steps:
      - uses: actions/checkout@v4
      - name: Build official pinned SpriteFusion Pixel Snapper
        run: |
          set -euxo pipefail
          cargo install --git https://github.com/Hugo-Dz/spritefusion-pixel-snapper \
            --rev "$PIXEL_SNAPPER_REV" --locked \
            --root "$RUNNER_TEMP/pixel-snapper" spritefusion-pixel-snapper
          mkdir -p "$RUNNER_TEMP/art-tool"
          cp "$RUNNER_TEMP/pixel-snapper/bin/spritefusion-pixel-snapper" "$RUNNER_TEMP/art-tool/"
          "$RUNNER_TEMP/art-tool/spritefusion-pixel-snapper" --version
          printf 'revision=%s\n' "$PIXEL_SNAPPER_REV" > "$RUNNER_TEMP/art-tool/PROVENANCE.txt"
          sha256sum "$RUNNER_TEMP/art-tool/spritefusion-pixel-snapper" > "$RUNNER_TEMP/art-tool/SHA256SUMS"
      - uses: actions/upload-artifact@v4
        with:
          name: pinned-pixel-snapper-linux-x64
          path: ${{ runner.temp }}/art-tool/
          retention-days: 1
