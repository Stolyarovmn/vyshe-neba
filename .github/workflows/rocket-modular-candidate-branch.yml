name: Materialize rocket modular candidates on feature branch

on:
  push:
    branches:
      - 2d_rocket-modular-sprites
    paths:
      - 'art/source_transport/rocket_modular/**'
      - 'art/prompts/rocket_body.md'
      - 'art/prompts/rocket_fins.md'
      - 'art/placeables/PIPELINE_CONFIG.json'
      - '.github/workflows/rocket-modular-candidate-branch.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  ASEPRITE_VERSION: '1.3.18.6'
  PIXEL_SNAPPER_REV: 'ae20461f60fb39e75d15f184bab1ebec1219511c'

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2d_rocket-modular-sprites
          fetch-depth: 0

      - name: Install art build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            clang cmake ninja-build unzip curl python3-pil jq \
            libpixman-1-dev libfreetype6-dev libharfbuzz-dev zlib1g-dev \
            libx11-dev libxcursor-dev libxi-dev libxrandr-dev libgl1-mesa-dev \
            libfontconfig1-dev libjpeg-dev libpng-dev libwebp-dev

      - name: Restore canonical art tool cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/art-tool-cache
          key: art-tools-${{ runner.os }}-${{ runner.arch }}-aseprite-1.3.18.6-none-snapper-ae20461f

      - name: Set up canonical art tools
        run: bash tools/art_pipeline/setup_art_tools.sh "$RUNNER_TEMP/art-tools" "$RUNNER_TEMP/art-tool-cache"

      - name: Build both deterministic candidates
        shell: bash
        run: |
          set -euo pipefail
          for asset in R_BODY R_FINS; do
            out="$RUNNER_TEMP/$asset"
            python3 tools/art_pipeline/process_asset.py \
              --repo-root . --asset "$asset" --output "$out" \
              --state-dir "$out/.tracker" \
              --pixel-snapper "$RUNNER_TEMP/art-tools/spritefusion-pixel-snapper" \
              --aseprite "$RUNNER_TEMP/art-tools/aseprite"
          done

      - name: Commit candidate materialization
        shell: bash
        run: |
          set -euo pipefail
          rm -rf art/candidates/rocket_modular
          mkdir -p art/candidates/rocket_modular/body art/candidates/rocket_modular/fins
          cp -a "$RUNNER_TEMP/R_BODY/." art/candidates/rocket_modular/body/
          cp -a "$RUNNER_TEMP/R_FINS/." art/candidates/rocket_modular/fins/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f art/candidates/rocket_modular
          git commit -m '2D rocket: materialize modular candidates for visual QA'
          git push origin HEAD:2d_rocket-modular-sprites
