name: Repository final prune

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repo-final-prune.yml'

permissions:
  contents: write
  actions: write

jobs:
  prune:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      STALE_RUN_ID: '39114680818'
    steps:
      - name: Cancel stale repair run and remove every branch except main
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          auth=(-H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")

          code=$(curl -sS -o /tmp/cancel.json -w '%{http_code}' -X POST "${auth[@]}" "${api}/actions/runs/${STALE_RUN_ID}/cancel")
          echo "cancel stale W04 run: HTTP ${code}"
          if [[ "$code" != "202" && "$code" != "409" ]]; then cat /tmp/cancel.json || true; fi

          for pass in 1 2 3 4 5; do
            mapfile -t branches < <(curl -fsSL "${auth[@]}" "${api}/branches?per_page=100" | jq -r '.[].name')
            for branch in "${branches[@]}"; do
              [[ "$branch" == "main" ]] && continue
              encoded=$(python3 -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$branch")
              code=$(curl -sS -o /tmp/delete.json -w '%{http_code}' -X DELETE "${auth[@]}" "${api}/git/refs/heads/${encoded}")
              echo "delete ${branch}: HTTP ${code}"
            done
            sleep 2
          done

          mapfile -t remaining < <(curl -fsSL "${auth[@]}" "${api}/branches?per_page=100" | jq -r '.[].name | select(. != "main")')
          if (( ${#remaining[@]} )); then
            printf 'Remaining branches: %s\n' "${remaining[*]}" >&2
            exit 1
          fi
