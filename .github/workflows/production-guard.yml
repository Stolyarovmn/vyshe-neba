name: Production guard

on:
  pull_request:
    branches: [game-production]
    paths:
      - 'skills/vyshe-neba-production-guard/**'
      - 'art/reference_specs/**'
      - 'art/schemas/production-guard-*.json'
      - 'art/prompts/era_references/**'
      - 'tools/art_pipeline/production_guard.py'
      - 'tools/art_pipeline/imagegen_chat_bridge.py'
      - 'tools/art_pipeline/compose_era_reference_sheet.py'
      - 'tools/art_pipeline/tests/test_compose_era_reference_sheet.py'
      - 'tools/art_pipeline/tests/test_production_guard.py'
      - 'tools/art_pipeline/validate_era_reference_uniqueness.py'
      - 'tools/art_pipeline/tests/test_validate_era_reference_uniqueness.py'
      - 'art/references/eras/e2_1998/reviews/inter-sheet-uniqueness-audit.json'
      - '.github/workflows/production-guard.yml'
  push:
    branches: [game-production]
    paths:
      - 'skills/vyshe-neba-production-guard/**'
      - 'art/reference_specs/**'
      - 'art/schemas/production-guard-*.json'
      - 'art/prompts/era_references/**'
      - 'tools/art_pipeline/production_guard.py'
      - 'tools/art_pipeline/imagegen_chat_bridge.py'
      - 'tools/art_pipeline/compose_era_reference_sheet.py'
      - 'tools/art_pipeline/tests/test_compose_era_reference_sheet.py'
      - 'tools/art_pipeline/tests/test_production_guard.py'
      - 'tools/art_pipeline/validate_era_reference_uniqueness.py'
      - 'tools/art_pipeline/tests/test_validate_era_reference_uniqueness.py'
      - 'art/references/eras/e2_1998/reviews/inter-sheet-uniqueness-audit.json'
      - '.github/workflows/production-guard.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate production-guard specs and prompt drift
        run: python3 tools/art_pipeline/production_guard.py validate-tree
      - name: Compile explicit imagegen context bridge
        run: python3 -m py_compile tools/art_pipeline/imagegen_chat_bridge.py
      - name: Run production-guard regression tests
        run: python3 tools/art_pipeline/tests/test_production_guard.py
      - name: Check E2 cross-sheet audit coverage
        run: python3 tools/art_pipeline/validate_era_reference_uniqueness.py
      - name: Test E2 uniqueness audit checker
        run: python3 tools/art_pipeline/tests/test_validate_era_reference_uniqueness.py
      - name: Pin Python and composer image dependency
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Pillow
        run: python -m pip install Pillow==12.0.0
      - name: Test deterministic specimen composition
        run: python tools/art_pipeline/tests/test_compose_era_reference_sheet.py
      - name: Parse guard JSON schemas
        run: |
          python3 -m json.tool art/schemas/production-guard-reference-sheet-spec.schema.json >/dev/null
          python3 -m json.tool art/schemas/production-guard-source-review.schema.json >/dev/null
