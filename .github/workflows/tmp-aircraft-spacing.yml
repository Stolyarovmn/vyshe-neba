name: Temporary aircraft spacing patcher
on:
  push:
    branches:
      - 2d_world-background-traffic-fix
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message == 'Run aircraft spacing patcher'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2d_world-background-traffic-fix
      - run: python3 tools/tmp_space_aircraft_slots.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add live/aircraft.js
          git diff --cached --check
          git commit -m '2D: space aircraft slots [aircraft-spacing-generated]'
          git push origin HEAD:2d_world-background-traffic-fix
