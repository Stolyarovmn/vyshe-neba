name: B03 landing guidance art production

on:
  push:
    branches: [2d_workshop-placeables-w01]
    paths:
      - 'art/source_transport/b03_landing_guidance/**'
      - 'tools/art_pipeline/decode_indexed_transport.py'
      - 'tools/art_pipeline/normalize_sprite.py'
      - 'tools/art_pipeline/qa_sprite.py'
      - '.github/workflows/b03-art-pipeline.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  process-b03:
    runs-on: ubuntu-24.04
    env:
      ASEPRITE_VERSION: '1.3.18.6'
      PIXEL_SNAPPER_REV: 'ae20461f60fb39e75d15f184bab1ebec1219511c'
      TRANSPORT_DIR: art/source_transport/b03_landing_guidance
      OUTDIR: art/gen/placeables/base/landing_guidance
      RUNTIME_DIR: outputs/rocket/dist/assets/placeables/base/landing_guidance
      COLORS: '32'
      PIXEL_SIZE: '14'
      WIDTH: '46'
      HEIGHT: '82'
      REG_X: '23'
      REG_Y: '78'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check B03 text transport set
        shell: bash
        run: |
          set -euo pipefail
          for stem in e0_1978 e1_1986 e2_1998 e3_2015 e4_2035 e5_2060; do
            test -f "$TRANSPORT_DIR/${stem}.json"
          done

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build unzip libx11-dev libxcursor-dev libxi-dev libxrandr-dev libgl1-mesa-dev libfontconfig1-dev python3-pil jq
          cargo --version

      - name: Restore Aseprite build cache
        id: ase-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/vyshe-neba/aseprite
          key: aseprite-${{ runner.os }}-x64-${{ env.ASEPRITE_VERSION }}-skia-m124-runtime-v2

      - name: Build Aseprite from official source
        if: steps.ase-cache.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail
          WORK="$RUNNER_TEMP/aseprite-build"
          mkdir -p "$WORK" ~/.cache/vyshe-neba/aseprite
          curl -L --fail --retry 3 -o "$WORK/aseprite.zip" "https://github.com/aseprite/aseprite/releases/download/v${ASEPRITE_VERSION}/Aseprite-v${ASEPRITE_VERSION}-Source.zip"
          unzip -q "$WORK/aseprite.zip" -d "$WORK/src"
          ASE_SRC="$WORK/src"
          if [[ ! -f "$ASE_SRC/src/app/CMakeLists.txt" ]]; then
            ASE_SRC=$(find "$WORK/src" -maxdepth 2 -type f -name CMakeLists.txt -printf '%h\n' | while read -r d; do [[ -f "$d/src/app/CMakeLists.txt" ]] && echo "$d"; done | head -1)
          fi
          test -n "$ASE_SRC" && test -f "$ASE_SRC/src/app/CMakeLists.txt"
          test -f "$ASE_SRC/data/gui.xml"
          curl -L --fail --retry 3 -o "$WORK/skia.zip" 'https://github.com/aseprite/skia/releases/download/m124-08a5439a6b/Skia-Linux-Release-x64.zip'
          unzip -q "$WORK/skia.zip" -d "$WORK/skia"
          SKIA_LIB=$(find "$WORK/skia" -name libskia.a -print -quit)
          SKIA_CANVAS=$(find "$WORK/skia" -path '*/include/core/SkCanvas.h' -print -quit)
          SKIA_DIR=$(dirname "$(dirname "$(dirname "$SKIA_CANVAS")")")
          test -f "$SKIA_LIB" && test -d "$SKIA_DIR"
          cmake -S "$ASE_SRC" -B "$WORK/build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DLAF_BACKEND=skia \
            -DSKIA_DIR="$SKIA_DIR" \
            -DSKIA_LIBRARY_DIR="$(dirname "$SKIA_LIB")" \
            -DSKIA_LIBRARY="$SKIA_LIB"
          cmake --build "$WORK/build" --target aseprite -j"$(nproc)"
          rm -rf ~/.cache/vyshe-neba/aseprite/data
          cp "$WORK/build/bin/aseprite" ~/.cache/vyshe-neba/aseprite/aseprite
          cp -a "$ASE_SRC/data" ~/.cache/vyshe-neba/aseprite/data
          chmod +x ~/.cache/vyshe-neba/aseprite/aseprite

      - name: Install official SpriteFusion Pixel Snapper
        run: |
          set -euxo pipefail
          cargo install --git https://github.com/Hugo-Dz/spritefusion-pixel-snapper \
            --rev "$PIXEL_SNAPPER_REV" --locked \
            --root "$RUNNER_TEMP/pixel-snapper" spritefusion-pixel-snapper

      - name: Process B03 E0-E5
        shell: bash
        run: |
          set -euxo pipefail
          SNAP="$RUNNER_TEMP/pixel-snapper/bin/spritefusion-pixel-snapper"
          ASE=~/.cache/vyshe-neba/aseprite/aseprite
          WORK="$RUNNER_TEMP/b03"
          mkdir -p "$WORK" "$OUTDIR" "$RUNTIME_DIR"

          entries=(
            'e0_1978:E0:1978'
            'e1_1986:E1:1986'
            'e2_1998:E2:1998'
            'e3_2015:E3:2015'
            'e4_2035:E4:2035'
            'e5_2060:E5:2060'
          )

          for entry in "${entries[@]}"; do
            IFS=: read -r stem era year <<< "$entry"
            spec="$TRANSPORT_DIR/${stem}.json"
            decoded="$WORK/${stem}_transport3x.png"
            presnap="$WORK/${stem}_presnap12.png"
            snapped="$WORK/${stem}_snapped.png"
            normalized="$WORK/${stem}_normalized.png"
            final="$OUTDIR/${stem}.png"

            python3 tools/art_pipeline/decode_indexed_transport.py \
              --input "$spec" --output "$decoded"

            python3 - "$decoded" "$presnap" <<'PY'
          from PIL import Image
          from pathlib import Path
          import sys
          src, dst = map(Path, sys.argv[1:3])
          im = Image.open(src).convert('RGBA')
          im.resize((im.width * 4, im.height * 4), Image.Resampling.NEAREST).save(dst)
          PY

            "$SNAP" "$presnap" "$snapped" "$COLORS" --pixel-size "$PIXEL_SIZE"

            python3 tools/art_pipeline/normalize_sprite.py \
              --input "$snapped" --output "$normalized" \
              --width "$WIDTH" --height "$HEIGHT" \
              --anchor-x "$REG_X" --anchor-y "$REG_Y"

            "$ASE" -b "$normalized" \
              --dithering-algorithm none --color-mode indexed \
              --save-as "$final"

            python3 tools/art_pipeline/qa_sprite.py \
              --input "$final" --width "$WIDTH" --height "$HEIGHT" \
              --max-colors "$COLORS" --min-coverage 0.04 --min-bbox-fraction 0.35 \
              --report "$OUTDIR/${stem}.qa.json"

            cp "$final" "$RUNTIME_DIR/${stem}.png"

            source_gen_id=$(jq -r '.source_gen_id' "$spec")
            source_original_sha256=$(jq -r '.source_original_sha256' "$spec")
            transport_pixel_sha256=$(jq -r '.pixel_sha256' "$spec")
            cat > "$OUTDIR/${stem}.pipeline.json" <<JSON
          {
            "asset": "B03 landing_guidance",
            "era": "$era",
            "year": $year,
            "source_gen_id": "$source_gen_id",
            "source_original_sha256": "$source_original_sha256",
            "text_transport_format": "indexed-zlib-b85-v1",
            "transport_pixel_sha256": "$transport_pixel_sha256",
            "transport_canvas": [138, 246],
            "transport_to_presnap": "nearest-neighbor x4",
            "spritefusion_pixel_snapper_rev": "$PIXEL_SNAPPER_REV",
            "pixel_size": $PIXEL_SIZE,
            "colors": $COLORS,
            "aseprite": "$ASEPRITE_VERSION",
            "aseprite_dithering": "none",
            "target_canvas": [$WIDTH, $HEIGHT],
            "registration_target": [$REG_X, $REG_Y],
            "mechanism_pivots": "pending_measured_rig_pass"
          }
          JSON
          done

      - name: Build B03 QA contact sheet
        run: |
          python3 - <<'PY'
          from PIL import Image, ImageDraw
          from pathlib import Path
          stems = ['e0_1978','e1_1986','e2_1998','e3_2015','e4_2035','e5_2060']
          cell_w, cell_h, scale = 46, 82, 6
          sheet = Image.new('RGBA', (cell_w * 3 * scale, cell_h * 2 * scale), (30,30,34,255))
          for i, stem in enumerate(stems):
              im = Image.open(Path('art/gen/placeables/base/landing_guidance') / f'{stem}.png').convert('RGBA')
              im = im.resize((cell_w * scale, cell_h * scale), Image.Resampling.NEAREST)
              sheet.alpha_composite(im, ((i % 3) * cell_w * scale, (i // 3) * cell_h * scale))
          sheet.save('art/gen/placeables/base/landing_guidance/b03_qa_contact.png')
          PY

      - name: Upload B03 visual QA artifact
        uses: actions/upload-artifact@v4
        with:
          name: b03-qa-images
          path: |
            art/gen/placeables/base/landing_guidance/e*.png
            art/gen/placeables/base/landing_guidance/e*.qa.json
            art/gen/placeables/base/landing_guidance/b03_qa_contact.png

      - name: Commit verified B03 outputs
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$OUTDIR" "$RUNTIME_DIR"
          if git diff --cached --quiet; then
            echo 'No generated changes.'
            exit 0
          fi
          git commit -m 'Process B03 with text transport, Pixel Snapper and Aseprite [skip b03-art-pipeline]'
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
