name: B03 asset candidate

on:
  push:
    branches: [main]
    paths:
      - 'art/source_transport/b03_landing_guidance/**'
      - 'art/placeables/PIPELINE_CONFIG.json'
      - 'tools/art_pipeline/**'
      - '.github/workflows/b03-art-pipeline.yml'
      - '.github/workflows/asset-candidate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate:
    uses: ./.github/workflows/asset-candidate.yml
    with:
      asset: B03
