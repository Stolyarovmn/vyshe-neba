name: B02 E0 scale review

on:
  push:
    branches: [2d_workshop-placeables-w01]
    paths:
      - '.github/workflows/b02-e0-scale-review.yml'
      - 'art/raw/placeables/base/tracking_radar/sources.json'
      - 'tools/art_pipeline/normalize_sprite.py'
      - 'tools/art_pipeline/qa_sprite.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-24.04
    env:
      ASEPRITE_VERSION: '1.3.18.6'
      PIXEL_SNAPPER_REV: 'ae20461f60fb39e75d15f184bab1ebec1219511c'
      DRIVE_FILE_ID: '15myLTFVhAt6djvC2lFwDAQfLiIPcBI86'
      SOURCE_SHA256: 'c923200745544f7af6b7fd1572feee1d287a2eec3dff779b813a61f55cba9036'
      SOURCE_RGBA_SHA256: 'f5f78264cd266f4a4b19213f048b4c906b638ff4bfaa0768715b0ca8e117ca66'
      WIDTH: '134'
      HEIGHT: '118'
      REG_X: '67'
      REG_Y: '114'
      COLORS: '32'
    steps:
      - uses: actions/checkout@v4

      - name: Install processing dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y clang cmake ninja-build unzip libx11-dev libxcursor-dev libxi-dev libxrandr-dev libgl1-mesa-dev libfontconfig1-dev python3-pil jq

      - name: Fetch lossless approved E0 transport from Drive
        run: |
          set -euxo pipefail
          mkdir -p "$RUNNER_TEMP/b02"
          SRC="$RUNNER_TEMP/b02/e0_1978_source.png"
          curl -L --fail --retry 3 \
            "https://drive.usercontent.google.com/download?id=${DRIVE_FILE_ID}&export=download&confirm=t" \
            -o "$SRC"
          TRANSPORT_SHA=$(sha256sum "$SRC" | awk '{print $1}')
          echo "transport_sha256=$TRANSPORT_SHA"
          python3 - "$SRC" "$SOURCE_RGBA_SHA256" "$RUNNER_TEMP/b02/source_transport.json" "$TRANSPORT_SHA" "$SOURCE_SHA256" <<'PY'
          import hashlib, json, sys
          from pathlib import Path
          from PIL import Image
          p, expected_rgba, report, transport_sha, canonical_sha = sys.argv[1:]
          im=Image.open(p); im.load(); rgba=im.convert('RGBA')
          pixel_sha=hashlib.sha256(rgba.tobytes()).hexdigest()
          if rgba.size != (1396,1127):
              raise SystemExit(f'QA_FAIL: Drive transport size {rgba.size} != (1396,1127)')
          if pixel_sha != expected_rgba:
              raise SystemExit(f'QA_FAIL: Drive transport decoded RGBA {pixel_sha} != canonical {expected_rgba}')
          data={
              'canonical_source_sha256': canonical_sha,
              'transport_sha256': transport_sha,
              'decoded_rgba_sha256': pixel_sha,
              'decoded_rgba_matches_canonical': True,
              'size': list(rgba.size),
              'alpha_extrema': list(rgba.getchannel('A').getextrema()),
              'policy': 'Google Drive public transport may losslessly re-encode PNG bytes; canonical exact-byte SHA remains provenance source, decoded RGBA must match exactly'
          }
          Path(report).write_text(json.dumps(data,indent=2)+'\n')
          print(data)
          PY

      - name: Restore Aseprite build cache
        id: ase-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/vyshe-neba/aseprite
          key: aseprite-${{ runner.os }}-x64-${{ env.ASEPRITE_VERSION }}-skia-m124-runtime-v2

      - name: Build Aseprite from official source
        if: steps.ase-cache.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail
          WORK="$RUNNER_TEMP/aseprite-build"
          mkdir -p "$WORK" ~/.cache/vyshe-neba/aseprite
          curl -L --fail --retry 3 -o "$WORK/aseprite.zip" "https://github.com/aseprite/aseprite/releases/download/v${ASEPRITE_VERSION}/Aseprite-v${ASEPRITE_VERSION}-Source.zip"
          unzip -q "$WORK/aseprite.zip" -d "$WORK/src"
          ASE_SRC="$WORK/src"
          if [[ ! -f "$ASE_SRC/src/app/CMakeLists.txt" ]]; then
            ASE_SRC=$(find "$WORK/src" -maxdepth 2 -type f -name CMakeLists.txt -printf '%h\n' | while read -r d; do [[ -f "$d/src/app/CMakeLists.txt" ]] && echo "$d"; done | head -1)
          fi
          test -n "$ASE_SRC" && test -f "$ASE_SRC/src/app/CMakeLists.txt"
          test -f "$ASE_SRC/data/gui.xml"
          curl -L --fail --retry 3 -o "$WORK/skia.zip" 'https://github.com/aseprite/skia/releases/download/m124-08a5439a6b/Skia-Linux-Release-x64.zip'
          unzip -q "$WORK/skia.zip" -d "$WORK/skia"
          SKIA_LIB=$(find "$WORK/skia" -name libskia.a -print -quit)
          SKIA_CANVAS=$(find "$WORK/skia" -path '*/include/core/SkCanvas.h' -print -quit)
          SKIA_DIR=$(dirname "$(dirname "$(dirname "$SKIA_CANVAS")")")
          cmake -S "$ASE_SRC" -B "$WORK/build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DLAF_BACKEND=skia \
            -DSKIA_DIR="$SKIA_DIR" \
            -DSKIA_LIBRARY_DIR="$(dirname "$SKIA_LIB")" \
            -DSKIA_LIBRARY="$SKIA_LIB"
          cmake --build "$WORK/build" --target aseprite -j"$(nproc)"
          rm -rf ~/.cache/vyshe-neba/aseprite/data
          cp "$WORK/build/bin/aseprite" ~/.cache/vyshe-neba/aseprite/aseprite
          cp -a "$ASE_SRC/data" ~/.cache/vyshe-neba/aseprite/data
          chmod +x ~/.cache/vyshe-neba/aseprite/aseprite
          test -f ~/.cache/vyshe-neba/aseprite/data/gui.xml
          (cd ~/.cache/vyshe-neba/aseprite && ./aseprite --version)

      - name: Install official SpriteFusion Pixel Snapper
        run: |
          set -euxo pipefail
          cargo install --git https://github.com/Hugo-Dz/spritefusion-pixel-snapper \
            --rev "$PIXEL_SNAPPER_REV" --locked \
            --root "$RUNNER_TEMP/pixel-snapper" spritefusion-pixel-snapper
          "$RUNNER_TEMP/pixel-snapper/bin/spritefusion-pixel-snapper" --version

      - name: Render pixel-size 10 and 11 candidates
        run: |
          set -euxo pipefail
          SRC="$RUNNER_TEMP/b02/e0_1978_source.png"
          SNAP="$RUNNER_TEMP/pixel-snapper/bin/spritefusion-pixel-snapper"
          ASE=~/.cache/vyshe-neba/aseprite/aseprite
          OUT="$RUNNER_TEMP/b02-review"
          mkdir -p "$OUT"
          cp "$RUNNER_TEMP/b02/source_transport.json" "$OUT/source_transport.json"
          for PX in 10 11; do
            "$SNAP" "$SRC" "$OUT/e0_px${PX}_snapped.png" "$COLORS" --pixel-size "$PX"
            python3 tools/art_pipeline/normalize_sprite.py \
              --input "$OUT/e0_px${PX}_snapped.png" \
              --output "$OUT/e0_px${PX}_normalized.png" \
              --width "$WIDTH" --height "$HEIGHT" \
              --anchor-x "$REG_X" --anchor-y "$REG_Y"
            "$ASE" -b "$OUT/e0_px${PX}_normalized.png" \
              --dithering-algorithm none --color-mode indexed \
              --save-as "$OUT/e0_px${PX}_final.png"
            python3 tools/art_pipeline/qa_sprite.py \
              --input "$OUT/e0_px${PX}_final.png" \
              --width "$WIDTH" --height "$HEIGHT" \
              --max-colors "$COLORS" --min-coverage 0.01 --min-bbox-fraction 0.25 \
              --report "$OUT/e0_px${PX}.qa.json"
          done
          python3 - "$OUT" <<'PY'
          import json, sys
          from pathlib import Path
          from PIL import Image, ImageDraw
          root=Path(sys.argv[1]); scale=4; cell=(134,118)
          sheet=Image.new('RGBA',(cell[0]*scale*2+24,cell[1]*scale+40),(13,20,27,255))
          d=ImageDraw.Draw(sheet)
          for i,px in enumerate((10,11)):
              im=Image.open(root/f'e0_px{px}_final.png').convert('RGBA').resize((cell[0]*scale,cell[1]*scale),Image.Resampling.NEAREST)
              x=8+i*(cell[0]*scale+8); y=28
              sheet.alpha_composite(im,(x,y)); d.text((x,8),f'pixel-size {px}',fill=(235,235,225,255))
          sheet.save(root/'b02_e0_scale_compare.png')
          reports={str(px):json.loads((root/f'e0_px{px}.qa.json').read_text()) for px in (10,11)}
          (root/'scale_review.json').write_text(json.dumps({'asset':'B02 tracking_radar','canonical_source_sha256':'c923200745544f7af6b7fd1572feee1d287a2eec3dff779b813a61f55cba9036','candidates':reports},indent=2)+'\n')
          PY

      - name: Upload B02 E0 scale review
        uses: actions/upload-artifact@v4
        with:
          name: b02-e0-scale-review
          path: ${{ runner.temp }}/b02-review/
          retention-days: 7
