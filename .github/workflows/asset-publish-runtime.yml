name: Publish approved production asset to clean runtime

on:
  workflow_dispatch:
    inputs:
      asset:
        description: Asset key from art/runtime/RUNTIME_EXPORTS.json
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  publish-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: runtime-asset-${{ inputs.asset }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout production source
        uses: actions/checkout@v4
        with:
          ref: game-production
          path: production
          fetch-depth: 1

      - name: Checkout clean runtime branch
        uses: actions/checkout@v4
        with:
          ref: main
          path: runtime
          fetch-depth: 0

      - name: Replace canonical runtime files from exact approved production bytes
        run: |
          python3 production/tools/art_pipeline/publish_runtime_asset.py \
            --repo-root production \
            --runtime-root runtime \
            --asset '${{ inputs.asset }}' \
            --report "$RUNNER_TEMP/runtime-export.json"
          cat "$RUNNER_TEMP/runtime-export.json"
          echo "PRODUCTION_SHA=$(jq -r '.production_commit' "$RUNNER_TEMP/runtime-export.json")" >> "$GITHUB_ENV"
          echo "RUNTIME_BASE_SHA=$(jq -r '.runtime_base_commit' "$RUNNER_TEMP/runtime-export.json")" >> "$GITHUB_ENV"

      - name: Enforce runtime diff boundary
        shell: bash
        run: |
          set -euo pipefail
          cd runtime
          mapfile -t allowed_changed < <(jq -r '.files[] | select(.changed == true) | .target' "$RUNNER_TEMP/runtime-export.json" | sort -u)
          mapfile -t changed < <(git diff --name-only | sort -u)
          if [ "${#allowed_changed[@]}" -eq 0 ]; then
            if [ "${#changed[@]}" -ne 0 ]; then
              echo 'Runtime changed even though approved bytes already matched all targets.' >&2
              printf '%s\n' "${changed[@]}" >&2
              exit 1
            fi
            echo 'Approved bytes already match runtime; no runtime replacement PR is needed.'
            exit 0
          fi
          printf '%s\n' "${allowed_changed[@]}" > "$RUNNER_TEMP/allowed-changed.txt"
          printf '%s\n' "${changed[@]}" > "$RUNNER_TEMP/changed.txt"
          if ! diff -u "$RUNNER_TEMP/allowed-changed.txt" "$RUNNER_TEMP/changed.txt"; then
            echo 'Runtime publish changed paths outside the explicit changed export targets.' >&2
            exit 1
          fi
          if grep -E '(^|/)(old|previous|backup|bak|archive|v[0-9]+)(/|$)|(_old|_previous|_backup|\.bak)(\.|$)' "$RUNNER_TEMP/changed.txt"; then
            echo 'Historical/backup runtime copy detected; runtime must contain only the active canonical file.' >&2
            exit 1
          fi

      - name: Build exact runtime tree
        shell: bash
        run: |
          set -euo pipefail
          cd runtime
          npm install --no-package-lock --no-audit --no-fund
          npm run build
          mapfile -t allowed_changed < <(jq -r '.files[] | select(.changed == true) | .target' "$RUNNER_TEMP/runtime-export.json" | sort -u)
          mapfile -t changed < <(git diff --name-only | sort -u)
          if [ "${#allowed_changed[@]}" -eq 0 ] && [ "${#changed[@]}" -eq 0 ]; then
            exit 0
          fi
          printf '%s\n' "${allowed_changed[@]}" > "$RUNNER_TEMP/allowed-after-build.txt"
          printf '%s\n' "${changed[@]}" > "$RUNNER_TEMP/changed-after-build.txt"
          diff -u "$RUNNER_TEMP/allowed-after-build.txt" "$RUNNER_TEMP/changed-after-build.txt"

      - name: Create runtime replacement PR
        shell: bash
        run: |
          set -euo pipefail
          cd runtime
          mapfile -t targets < <(jq -r '.files[] | select(.changed == true) | .target' "$RUNNER_TEMP/runtime-export.json" | sort -u)
          if [ "${#targets[@]}" -eq 0 ]; then
            echo 'Runtime already contains the exact approved bytes; nothing to publish.'
            exit 0
          fi
          asset='${{ inputs.asset }}'
          branch="runtime_asset-${asset,,}-${GITHUB_RUN_ID}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$branch"
          for target in "${targets[@]}"; do git add -- "$target"; done
          mapfile -t staged < <(git diff --cached --name-only | sort -u)
          if [ "${staged[*]}" != "${targets[*]}" ]; then
            echo 'Staged runtime paths do not exactly equal changed export targets.' >&2
            printf 'staged:\n'; printf '%s\n' "${staged[@]}" >&2
            printf 'targets:\n'; printf '%s\n' "${targets[@]}" >&2
            exit 1
          fi
          git commit -m "Runtime: replace ${asset} with approved production art"
          git push origin "$branch"
          {
            echo 'Boundary B only: exact approved bytes from game-production replace existing canonical game/assets paths in main.'
            echo
            echo "Production source commit: ${PRODUCTION_SHA}"
            echo "Runtime base commit: ${RUNTIME_BASE_SHA}"
            echo
            echo 'Changed runtime files:'
            jq -r '.files[] | select(.changed == true) | "- `\(.target)` <= `\(.source)` SHA-256 `\(.sha256)`"' "$RUNNER_TEMP/runtime-export.json"
            echo
            echo 'No production history, backup copy, art/gen mirror or legacy outputs mirror is included. Rollback is by Git revert/history.'
            echo 'Build executed before PR creation: `npm run build`.'
          } > "$RUNNER_TEMP/pr-body.md"
          gh pr create \
            --base main \
            --head "$branch" \
            --title "Runtime: replace ${asset} approved asset" \
            --body-file "$RUNNER_TEMP/pr-body.md"
